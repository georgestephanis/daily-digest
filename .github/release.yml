changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
      - chore
    authors:
      - dependabot

  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Fixes"
      labels:
        - bug
        - fix

    - title: "🧱 Refactors"
      labels:
        - refactor

    - title: "🧪 Tests & Tooling"
      labels:
        - test
        - ci
        - tooling

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "Other Changes"
      labels:
        - "*"
